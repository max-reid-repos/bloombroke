<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bloombroke: a free market terminal. Pro $4.20/mo.</title>
  <meta name="description" content="A free market terminal for normal people. Type a plain English command, get the answer: quotes, charts, news, currency conversion and money tools.">
  <meta name="theme-color" content="#05080C">
  <meta name="color-scheme" content="dark">
  <meta property="og:title" content="Bloombroke: a free market terminal. Pro $4.20/mo.">
  <meta property="og:description" content="A free market terminal for normal people: quotes, charts, news, FX and money tools. Type a command, get the answer.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2305080C'/%3E%3Cpath d='M8 9l8 7-8 7' fill='none' stroke='%236CCBFF' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M18 23h7' stroke='%23CFEAFF' stroke-width='3.2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Caveat:wght@700&display=swap">
  <link rel="stylesheet" href="/legal.css">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/commands.css">
  <link rel="stylesheet" href="/commands-markets.css">
  <link rel="stylesheet" href="/pro.css">
  <link rel="stylesheet" href="/kit.css">
  <link rel="stylesheet" href="/nav.css">
  <link rel="stylesheet" href="/company-ui.css">
  <script type="module" src="/app.js"></script>
  <script defer data-website-id="dfid_RaIYVk8TuhGSz6fl2wpPa" data-domain="bloombroke.com" src="https://datafa.st/js/script.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="/?c=HOME" data-cmd="HOME" aria-label="Bloombroke home">BLOOMBROKE</a>
    <div class="clock" aria-live="off">
      <span class="label">NEW YORK</span>
      <time id="clock" class="clock-time">--:--:--</time>
      <span id="fresh-dot" class="fresh-dot" data-state="none" role="img" aria-label="No data on this screen"></span>
      <span id="market-status" class="status" data-open="false"><span class="status-dot" aria-hidden="true"></span><span class="status-text">MARKET CLOSED</span></span>
    </div>
  </header>

  <div class="commandbar">
    <form id="cmd-form" class="cmd" autocomplete="off" role="search">
      <span class="cmd-label"><span id="screen-title" class="cmd-label-text"></span><button type="button" id="head-star" class="star head-star" hidden aria-pressed="false"><span class="star-icon" aria-hidden="true">&#9734;</span><span class="offscreen"></span></button></span>
      <span class="prompt" aria-hidden="true">&gt;</span>
      <div class="cmd-field">
        <input id="cmd" name="c" type="text" maxlength="256" spellcheck="false" autocapitalize="characters" autocorrect="off"
               enterkeyhint="go" aria-label="Command" aria-autocomplete="list" aria-controls="suggest"
               aria-expanded="false" placeholder="Type a command or a symbol: AAPL, GOLD, FX 500 USD THB, HELP">
        <span id="cursor" class="cursor" aria-hidden="true"></span>
        <span id="measure" class="measure" aria-hidden="true">M</span>
      </div>
      <span class="cmd-keys" aria-hidden="true"><kbd>Enter</kbd> run <kbd>Tab</kbd> complete <kbd>Ctrl K</kbd> menu</span>
      <ul id="suggest" class="suggest" role="listbox" hidden></ul>
    </form>
  </div>

  <nav id="tickerbar" class="fnbar tickerbar" hidden aria-label="Stock functions"></nav>

  <main id="screen" class="screen" tabindex="-1" aria-live="polite"></main>

  <div class="dock">
    <div id="tape-bar" class="tape" aria-label="Market ticker" hidden><div class="tape-track"></div></div>
    <div class="statusline" role="status" aria-live="polite">
      <span id="status-msg" class="status-msg">READY</span>
      <span id="status-legal" class="status-legal"><span class="legal-line">Not advice</span><span class="legal-sep" aria-hidden="true">&middot;</span><a href="/terms">Terms</a></span>
    </div>
    <nav id="keybar" class="keybar" aria-label="Function keys"></nav>
  </div>
</body>
</html>
